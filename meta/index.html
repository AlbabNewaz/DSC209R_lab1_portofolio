<h1>Repository Meta Visualization 1.2</h1>

<!-- Slider -->
<div id="time-filter">
  <label for="commit-progress">Show commits until:</label>
  <input type="range" id="commit-progress" min="0" max="100" value="100" />
  <time id="commit-time"></time>
</div>

<!-- Summary -->
<section id="summary"></section>

<!-- Scrolly setup -->
<div id="scrolly-1">
  <!-- Left-side explanatory text -->
  <div id="scatter-story">
    <p>Some filler text here explaining the scatter plot.</p>
  </div>

  <!-- Right-side scatter plot -->
  <div id="scatter-plot">
    <div id="chart-container">
      <svg id="scatterplot"></svg>
    </div>
    <div id="selection-summary"></div>
  </div>
</div>

<!-- File/unit visualization at the bottom -->
<dl id="files"></dl>

<script type="module" src="main.js"></script>
</body>
</html>
